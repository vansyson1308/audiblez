[project]
name = "audiblez"
version = "0.5.0"
description = "Generate audiobooks from e-books (epub to m4b and YouTube mp4), with Kokoro-82M and Qwen3-TTS"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "numpy (>=1.26)",
    "pick (>=2.4.0,<3.0.0)",
    "beautifulsoup4 (>=4.12)",
    "lxml (>=5.0)",
    "kokoro (==0.9.4)",
    "misaki[zh] (>=0.9.2)",
    "tabulate (>=0.9.0,<0.10.0)",
    "qwen-tts (>=0.1.1,<0.2.0)",
    "librosa (>=0.10)",
    "num2words (>=0.5.13)",
    "pymorphy3 (>=2.0)",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[project.optional-dependencies]
# Automatic quality control: every synthesized sentence is transcribed with Whisper and regenerated if it differs
asr = ["faster-whisper (>=1.1)"]
gui = ["wxpython (>=4.2)", "pillow (>=10)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/santinic/audiblez"
Repository = "https://github.com/santinic/audiblez"
Issues = "https://github.com/santinic/audiblez/issues"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"
audiblez-voice = "audiblez.voice_tool:main"

[tool.poetry]
include = [{ path = "audiblez/voices/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"
pytest = "^8.0"
