[project]
name = "audiblez"
version = "0.6.0"
description = "Generate audiobooks from e-books and your own stories (epub/txt/md to m4b and YouTube mp4), with Kokoro-82M and Qwen3-TTS"
authors = [
    { name = "Claudio Santini", email = "hireclaudio@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "ebooklib (>=0.18,<0.19)",
    "soundfile (>=0.13.1,<0.14.0)",
    "numpy (>=1.26)",
    "pick (>=2.4.0,<3.0.0)",
    "beautifulsoup4 (>=4.12)",
    "lxml (>=5.0)",
    # Kokoro (English and 8 other languages) does not support Python 3.13 yet, which Kaggle and Colab now use;
    # Qwen3-TTS (Russian, Japanese, Korean...) works there without it
    "kokoro (==0.9.4) ; python_version < '3.13'",
    "misaki[zh] (>=0.9.2) ; python_version < '3.13'",
    "tabulate (>=0.9.0,<0.10.0)",
    "librosa (>=0.10)",
    "num2words (>=0.5.13)",
    "pymorphy3 (>=2.0)",
]
exclude = [
    "imgs",
    "test",
    "*.wav",
    "*.m4b",
    "cover",
    "chapters.txt"
]

[project.optional-dependencies]
# Qwen3-TTS engine (Russian, Japanese, Korean... voice cloning). Choose ONE of "qwen" or "fast":
#   qwen: reference implementation (CPU, Apple, any CUDA GPU)
#   fast: CUDA-graph accelerated faster-qwen3-tts (NVIDIA GPU; ships its own qwen_tts build for Transformers 5)
qwen = ["qwen-tts (>=0.1.1,<0.2.0)"]
# (qwen-tts-hf 0.1.1.post1, used by faster-qwen3-tts, fails to load the model with Transformers >= 5.17)
fast = ["faster-qwen3-tts (>=0.5.4,<0.6)", "transformers (>=5.15.1,<5.17)"]
# Automatic quality control: every synthesized sentence is transcribed with Whisper and regenerated if it differs
asr = ["faster-whisper (>=1.1)"]
# Japanese: correct readings of numbers with counters (3本, 4人, 14日) and kana-based Whisper checks
ja = ["pyopenjtalk-plus (>=0.4.1)", "fugashi[unidic-lite] (>=1.3)"]
gui = ["wxpython (>=4.2)", "pillow (>=10)"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.urls]
Homepage = "https://claudio.uk/posts/epub-to-audiobook.html"
Documentation = "https://github.com/santinic/audiblez"
Repository = "https://github.com/santinic/audiblez"
Issues = "https://github.com/santinic/audiblez/issues"

[project.scripts]
audiblez = "audiblez.cli:cli_main"
audiblez-ui = "audiblez.ui:main"
audiblez-voice = "audiblez.voice_tool:main"

[tool.poetry]
include = [{ path = "audiblez/voices/**/*", format = ["sdist", "wheel"] }]

[tool.poetry.group.dev.dependencies]
deptry = "^0.23.0"
pytest = "^8.0"
